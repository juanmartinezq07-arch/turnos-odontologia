[project]
name = "turnos-odontologia"
version = "0.1.0"
description = "TurnosAR MVP — API de turnos odontológicos con invariante RN02 en Postgres"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.0",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "httpx>=0.27",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "python-dotenv>=1.0",
  "tzdata>=2024.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.alembic]
script_location = "alembic"
