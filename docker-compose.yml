name: turnos-odontologia

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: turnos
      POSTGRES_USER: turnos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-turnos-dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turnos -d turnos"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
